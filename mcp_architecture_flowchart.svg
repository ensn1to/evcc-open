<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .text { font-family: Arial, sans-serif; font-size: 12px; fill: #2c3e50; }
      .small-text { font-family: Arial, sans-serif; font-size: 10px; fill: #7f8c8d; }
      .box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; rx: 5; }
      .mcp-box { fill: #e8f5e8; stroke: #27ae60; stroke-width: 2; rx: 5; }
      .api-box { fill: #e8f4fd; stroke: #3498db; stroke-width: 2; rx: 5; }
      .client-box { fill: #fdf2e8; stroke: #e67e22; stroke-width: 2; rx: 5; }
      .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .data-arrow { stroke: #27ae60; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .config-arrow { stroke: #e74c3c; stroke-width: 2; fill: none; marker-end: url(#arrowhead); stroke-dasharray: 5,5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" class="title">evcc MCP (Model Context Protocol) 架构流程图</text>
  
  <!-- Configuration Layer -->
  <rect x="50" y="60" width="200" height="80" class="box"/>
  <text x="150" y="85" text-anchor="middle" class="subtitle">配置层</text>
  <text x="60" y="105" class="text">• --mcp 命令行参数</text>
  <text x="60" y="120" class="text">• viper.GetBool("mcp")</text>
  <text x="60" y="135" class="text">• 路径: /mcp</text>
  
  <!-- HTTP Server -->
  <rect x="300" y="60" width="200" height="80" class="api-box"/>
  <text x="400" y="85" text-anchor="middle" class="subtitle">HTTP 服务器</text>
  <text x="310" y="105" class="text">• httpd.Router()</text>
  <text x="310" y="120" class="text">• 端口: 7070 (默认)</text>
  <text x="310" y="135" class="text">• 路由注册</text>
  
  <!-- MCP Handler -->
  <rect x="550" y="60" width="250" height="80" class="mcp-box"/>
  <text x="675" y="85" text-anchor="middle" class="subtitle">MCP 处理器</text>
  <text x="560" y="105" class="text">• mcp.NewHandler()</text>
  <text x="560" y="120" class="text">• StreamableHTTPHandler</text>
  <text x="560" y="135" class="text">• 监听: baseUrl + /mcp</text>
  
  <!-- OpenAPI Spec -->
  <rect x="50" y="180" width="200" height="100" class="api-box"/>
  <text x="150" y="205" text-anchor="middle" class="subtitle">OpenAPI 规范</text>
  <text x="60" y="225" class="text">• openapi.json (嵌入)</text>
  <text x="60" y="240" class="text">• 解析和验证</text>
  <text x="60" y="255" class="text">• 服务器配置:</text>
  <text x="60" y="270" class="small-text">  localhost:7070/api</text>
  
  <!-- MCP Server -->
  <rect x="300" y="180" width="250" height="100" class="mcp-box"/>
  <text x="425" y="205" text-anchor="middle" class="subtitle">MCP 服务器实例</text>
  <text x="310" y="225" class="text">• mcp.NewServer()</text>
  <text x="310" y="240" class="text">• 名称: "evcc"</text>
  <text x="310" y="255" class="text">• 版本: util.Version</text>
  <text x="310" y="270" class="text">• 工具和提示注册</text>
  
  <!-- Tools Registration -->
  <rect x="600" y="180" width="250" height="100" class="client-box"/>
  <text x="725" y="205" text-anchor="middle" class="subtitle">工具注册</text>
  <text x="610" y="225" class="text">• OpenAPI 工具自动生成</text>
  <text x="610" y="240" class="text">• 标签过滤: general, tariffs,</text>
  <text x="610" y="255" class="text">  loadpoints, vehicles, battery</text>
  <text x="610" y="270" class="text">• 自定义 docs 工具</text>
  
  <!-- API Categories -->
  <rect x="50" y="320" width="150" height="120" class="api-box"/>
  <text x="125" y="345" text-anchor="middle" class="subtitle">API 分类</text>
  <text x="60" y="365" class="text">• general (通用)</text>
  <text x="60" y="380" class="text">• tariffs (电价)</text>
  <text x="60" y="395" class="text">• loadpoints (充电点)</text>
  <text x="60" y="410" class="text">• vehicles (车辆)</text>
  <text x="60" y="425" class="text">• battery (电池)</text>
  
  <!-- Request Handler -->
  <rect x="250" y="320" width="200" height="120" class="mcp-box"/>
  <text x="350" y="345" text-anchor="middle" class="subtitle">请求处理器</text>
  <text x="260" y="365" class="text">• requestHandler(host)</text>
  <text x="260" y="380" class="text">• httptest.NewRecorder()</text>
  <text x="260" y="395" class="text">• 代理到主路由器</text>
  <text x="260" y="410" class="text">• 返回 HTTP 响应</text>
  
  <!-- Prompts -->
  <rect x="500" y="320" width="200" height="120" class="client-box"/>
  <text x="600" y="345" text-anchor="middle" class="subtitle">智能提示</text>
  <text x="510" y="365" class="text">• create-charge-plan</text>
  <text x="510" y="380" class="text">• 参数: loadpoint, vehicle</text>
  <text x="510" y="395" class="text">• 模板: prompt.tpl</text>
  <text x="510" y="410" class="text">• 充电计划优化</text>
  
  <!-- Documentation Tool -->
  <rect x="750" y="320" width="150" height="120" class="api-box"/>
  <text x="825" y="345" text-anchor="middle" class="subtitle">文档工具</text>
  <text x="760" y="365" class="text">• docs 工具</text>
  <text x="760" y="380" class="text">• 链接到:</text>
  <text x="760" y="395" class="small-text">  docs.evcc.io</text>
  <text x="760" y="410" class="text">• 资源链接类型</text>
  
  <!-- Client Interaction -->
  <rect x="200" y="480" width="300" height="80" class="client-box"/>
  <text x="350" y="505" text-anchor="middle" class="subtitle">客户端交互</text>
  <text x="210" y="525" class="text">• MCP 客户端连接 (如 Claude Desktop)</text>
  <text x="210" y="540" class="text">• WebSocket 或 HTTP 流式连接</text>
  <text x="210" y="555" class="text">• 工具调用和提示执行</text>
  
  <!-- Data Flow -->
  <rect x="550" y="480" width="250" height="80" class="mcp-box"/>
  <text x="675" y="505" text-anchor="middle" class="subtitle">数据流</text>
  <text x="560" y="525" class="text">• 工具调用 → API 请求</text>
  <text x="560" y="540" class="text">• 提示执行 → 模板渲染</text>
  <text x="560" y="555" class="text">• 响应格式化 → JSON 返回</text>
  
  <!-- Core Features -->
  <rect x="50" y="600" width="850" height="120" class="box"/>
  <text x="475" y="625" text-anchor="middle" class="subtitle">核心功能特性</text>
  
  <text x="70" y="650" class="text">• 自动 API 工具生成: 基于 OpenAPI 规范自动生成 MCP 工具</text>
  <text x="70" y="665" class="text">• 智能充电计划: 通过提示模板生成优化的充电策略</text>
  <text x="70" y="680" class="text">• 实时数据访问: 直接访问 evcc 的所有 API 端点</text>
  <text x="70" y="695" class="text">• 安全代理: 通过内部请求处理器安全访问受保护的端点</text>
  <text x="70" y="710" class="text">• 可扩展架构: 支持添加自定义工具和提示</text>
  
  <!-- Arrows -->
  <!-- Config to HTTP -->
  <line x1="250" y1="100" x2="300" y2="100" class="config-arrow"/>
  
  <!-- HTTP to MCP Handler -->
  <line x1="500" y1="100" x2="550" y2="100" class="arrow"/>
  
  <!-- OpenAPI to MCP Server -->
  <line x1="250" y1="230" x2="300" y2="230" class="data-arrow"/>
  
  <!-- MCP Server to Tools -->
  <line x1="550" y1="230" x2="600" y2="230" class="arrow"/>
  
  <!-- API Categories to Request Handler -->
  <line x1="200" y1="380" x2="250" y2="380" class="data-arrow"/>
  
  <!-- Request Handler to Prompts -->
  <line x1="450" y1="380" x2="500" y2="380" class="arrow"/>
  
  <!-- Prompts to Documentation -->
  <line x1="700" y1="380" x2="750" y2="380" class="arrow"/>
  
  <!-- MCP Handler to Client Interaction -->
  <line x1="675" y1="140" x2="350" y2="480" class="arrow"/>
  
  <!-- Client to Data Flow -->
  <line x1="500" y1="520" x2="550" y2="520" class="data-arrow"/>
  
  <!-- Vertical connections -->
  <line x1="425" y1="280" x2="425" y2="320" class="arrow"/>
  <line x1="350" y1="440" x2="350" y2="480" class="arrow"/>
  <line x1="675" y1="440" x2="675" y2="480" class="arrow"/>
  
  <!-- Legend -->
  <rect x="950" y="60" width="200" height="120" class="box"/>
  <text x="1050" y="85" text-anchor="middle" class="subtitle">图例</text>
  <line x1="960" y1="100" x2="990" y2="100" class="arrow"/>
  <text x="1000" y="105" class="small-text">数据流</text>
  <line x1="960" y1="120" x2="990" y2="120" class="data-arrow"/>
  <text x="1000" y="125" class="small-text">MCP 数据</text>
  <line x1="960" y1="140" x2="990" y2="140" class="config-arrow"/>
  <text x="1000" y="145" class="small-text">配置</text>
  <rect x="960" y="155" width="20" height="15" class="mcp-box"/>
  <text x="990" y="165" class="small-text">MCP 组件</text>
</svg>